name: Release

'on':
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  preflight:
    name: Reject an existing release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Verify release does not exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$(curl --proto '=https' --tlsv1.2 --silent --show-error \
            --output /dev/null --write-out '%{http_code}' \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          case "$status" in
            404) ;;
            200) echo "Release ${RELEASE_TAG} already exists; assets are immutable." >&2; exit 1 ;;
            *) echo "Release lookup returned HTTP ${status}." >&2; exit 1 ;;
          esac

  validate:
    name: Validate version metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag, packages, and changelog
        id: release
        shell: bash
        env:
          NOTES_PATH: ${{ runner.temp }}/release-notes.md
        run: |
          set -euo pipefail
          semver='(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*))(\.((0|[1-9][0-9]*)|([0-9]*[A-Za-z-][0-9A-Za-z-]*)))*)?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?'
          [[ "$RELEASE_TAG" =~ ^v${semver}$ ]] || { echo "tag must be v followed by full SemVer" >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          tag_commit="$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")"
          [[ "$tag_commit" == "$GITHUB_SHA" ]] || { echo "tag does not identify the workflow commit" >&2; exit 1; }
          cargo metadata --format-version 1 --no-deps --locked | jq -e --arg version "$version" '
            .workspace_members as $members |
            [.packages[] | select(.id as $id | $members | index($id))] as $packages |
            ($packages | length > 0) and
            ([$packages[] | select(.version != $version)] | length == 0)
          ' >/dev/null || { echo "workspace package versions do not match ${version}" >&2; exit 1; }
          VERSION="$version" ruby <<'RUBY'
          version = ENV.fetch("VERSION")
          changelog = File.read("CHANGELOG.md", encoding: "UTF-8")
          header = /^## \[#{Regexp.escape(version)}\] - \d{4}-\d{2}-\d{2}$/
          match = changelog.match(header)
          abort("CHANGELOG.md has no #{version} release section") unless match
          boundary = changelog.match(/^## /, match.end(0))
          notes = changelog[match.end(0)...(boundary&.begin(0) || changelog.length)].strip
          abort("CHANGELOG.md #{version} release section is empty") if notes.empty?
          File.write(ENV.fetch("NOTES_PATH"), "#{notes}\n", encoding: "UTF-8")
          RUBY
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Upload validated release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  cross-platform:
    name: Test ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: macOS
            os: macos-14
          - name: Windows
            os: windows-2022
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run cross-platform tests
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          cargo +1.85.0 test --workspace --locked

  quality:
    permissions:
      actions: read # Download the WASM artifact produced by the reusable workflow.
      contents: read
    uses: ./.github/workflows/quality.yml

  documentation:
    permissions:
      contents: read
    uses: ./.github/workflows/docs-quality.yml

  supply-chain:
    permissions:
      contents: read
    uses: ./.github/workflows/supply-chain.yml

  build:
    name: Build release archives
    needs: [validate, cross-platform, quality, documentation, supply-chain]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read # Download the WASM artifact produced in this run.
      contents: read
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download verified WASM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-package

      - name: Assemble platform-neutral archives
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          WASM_PACKAGE: ${{ runner.temp }}/wasm-package
        run: |
          set -euo pipefail
          static="crates/cron_maker_web/static"
          package="cron_maker-web-v${VERSION}"
          [[ -d "$static" && ! -L "$static" && -f "$static/index.html" ]]
          [[ -d "$WASM_PACKAGE" && ! -L "$WASM_PACKAGE" ]]
          [[ -f "$WASM_PACKAGE/cron_maker_web.js" ]]
          [[ -f "$WASM_PACKAGE/cron_maker_web_bg.wasm" ]]
          if find "$static" "$WASM_PACKAGE" -type l -print -quit | grep -q .; then
            echo "Release input contains a symbolic link" >&2
            exit 1
          fi
          if find "$static" "$WASM_PACKAGE" ! -type f ! -type d -print -quit | grep -q .; then
            echo "Release input contains a special file" >&2
            exit 1
          fi
          if find "$WASM_PACKAGE" -mindepth 2 -print -quit | grep -q .; then
            echo "WASM package must contain top-level files only" >&2
            exit 1
          fi
          mkdir -p "staging/${package}/pkg" release-source
          find "$static" -mindepth 1 -maxdepth 1 ! -name pkg -exec cp -a -- {} "staging/${package}/" \;
          while IFS= read -r -d '' file; do
            case "${file##*/}" in
              package.json|cron_maker_web.js|cron_maker_web_bg.wasm|*.d.ts|README.md|LICENSE|LICENSE.*) ;;
              *) echo "Unexpected WASM package file: ${file##*/}" >&2; exit 1 ;;
            esac
            cp -- "$file" "staging/${package}/pkg/"
          done < <(find "$WASM_PACKAGE" -maxdepth 1 -type f -print0)
          cp LICENSE README.md CHANGELOG.md "staging/${package}/"
          epoch="$(git show -s --format=%ct "$GITHUB_SHA")"
          find staging -exec touch -h -d "@${epoch}" {} +
          TZ=UTC tar --sort=name --mtime="@${epoch}" --owner=0 --group=0 --numeric-owner \
            -czf "release-source/${package}.tar.gz" -C staging "$package"
          (cd staging && zip -X -9 -r "../release-source/${package}.zip" "$package")
          jq -n --arg commit "$GITHUB_SHA" --arg version "$VERSION" \
            '{commit: $commit, version: $version}' > release-source/release-metadata.json

      - name: Upload release source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-source
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7

  evidence:
    name: Generate checksums, SBOM, and license evidence
    needs: [validate, build, preflight]
    permissions:
      contents: read
    uses: Tinkora/.github/.github/workflows/reusable-release.yml@ec412670eff1f85882d054253b09b9a78c8025f0 # Tinkora workflow bundle
    with:
      source-artifact-name: release-source-${{ github.run_id }}-${{ github.run_attempt }}
      version: ${{ needs.validate.outputs.version }}
      publish: false

  attest:
    name: Attest release archives
    needs: [validate, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Download the release candidate produced in this run.
      attestations: write # Publish provenance and SBOM attestations.
      contents: read
      id-token: write # Sign artifact attestations with GitHub OIDC.
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Verify candidate checksums
        run: cd release-candidate && sha256sum --check --strict SHA256SUMS

      - name: Attest tar build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/cron_maker-web-v${{ needs.validate.outputs.version }}.tar.gz

      - name: Attest tar SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/cron_maker-web-v${{ needs.validate.outputs.version }}.tar.gz
          sbom-path: release-candidate/SBOM.spdx.json

      - name: Attest zip build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/cron_maker-web-v${{ needs.validate.outputs.version }}.zip

      - name: Attest zip SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-candidate/cron_maker-web-v${{ needs.validate.outputs.version }}.zip
          sbom-path: release-candidate/SBOM.spdx.json

  verify:
    name: Verify release candidate
    needs: [validate, evidence, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # Download the attested release candidate.
      contents: read
    steps:
      - name: Download release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Verify paths, assets, and checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          candidate="release-candidate"
          if find "$candidate" -type l -print -quit | grep -q .; then
            echo "Release candidate contains a symbolic link" >&2
            exit 1
          fi
          if find "$candidate" ! -type f ! -type d -print -quit | grep -q .; then
            echo "Release candidate contains a special file" >&2
            exit 1
          fi
          expected=("cron_maker-web-v${VERSION}.tar.gz" "cron_maker-web-v${VERSION}.zip" SHA256SUMS SBOM.spdx.json LICENSES.json)
          for name in "${expected[@]}"; do
            [[ -f "$candidate/$name" ]] || { echo "Missing release asset: $name" >&2; exit 1; }
          done
          [[ "$(find "$candidate" -maxdepth 1 -type f | wc -l | tr -d ' ')" == "5" ]] || {
            echo "Unexpected top-level release asset" >&2
            exit 1
          }
          (cd "$candidate" && sha256sum --check --strict SHA256SUMS)

  release:
    name: Publish GitHub Release
    needs: [validate, evidence, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      actions: read # Download verified assets and release notes.
      contents: write # Create the GitHub Release and upload immutable assets.
    steps:
      - name: Download verified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.evidence.outputs.candidate-artifact-name }}
          path: release-candidate

      - name: Download validated release notes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-notes-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-notes

      - name: Reverify and publish immutable assets
        shell: bash
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ env.RELEASE_TAG }}
        run: |
          set -euo pipefail
          (cd release-candidate && sha256sum --check --strict SHA256SUMS)
          mapfile -d '' assets < <(find release-candidate -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          [[ "${#assets[@]}" == "5" ]] || { echo "Unexpected release asset count" >&2; exit 1; }
          release_id="$(gh api \
            --method POST \
            "repos/${GH_REPO}/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="$TAG" \
            -f body="$(cat release-notes/release-notes.md)" \
            -F draft=true \
            -F prerelease=false \
            --jq '.id')"
          release_json="$(gh api "repos/${GH_REPO}/releases/${release_id}")"
          test "$(jq -r '.tag_name' <<< "$release_json")" = "$TAG"
          test "$(jq -r '.draft' <<< "$release_json")" = true
          gh release upload "$TAG" "${assets[@]}"
          gh api \
            --method PATCH \
            "repos/${GH_REPO}/releases/${release_id}" \
            -F draft=false \
            --jq '.draft' | grep -qx false
