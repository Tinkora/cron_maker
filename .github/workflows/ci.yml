name: Continuous integration

'on':
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    permissions:
      actions: read # Download the WASM artifact produced by the reusable workflow.
      contents: read
    uses: ./.github/workflows/quality.yml

  documentation:
    permissions:
      contents: read
    uses: ./.github/workflows/docs-quality.yml

  supply-chain:
    permissions:
      contents: read
    uses: ./.github/workflows/supply-chain.yml
