name: Quality

'on':
  workflow_call:

permissions:
  contents: read

jobs:
  package-contents:
    name: Cargo package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Inspect package contents
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          for manifest in \
            crates/cron_maker_core/Cargo.toml \
            crates/cron_maker_web/Cargo.toml
          do
            cargo +1.85.0 package --manifest-path "$manifest" \
              --list --locked > package-contents.txt
            if grep -E '(^|/)(node_modules|pkg|target|test-results|playwright-report)/' \
              package-contents.txt
            then
              echo "Generated output is present in $manifest" >&2
              exit 1
            fi
          done

  rust:
    uses: Tinkora/.github/.github/workflows/reusable-rust-quality.yml@ec412670eff1f85882d054253b09b9a78c8025f0 # Tinkora workflow bundle
    with:
      working-directory: .
      toolchain: 1.85.0
      locked: true
      msrv: 1.85.0
      coverage: true

  wasm-check:
    name: wasm32 compilation check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the WASM target
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --no-self-update
          rustup target add wasm32-unknown-unknown --toolchain 1.85.0
          cargo +1.85.0 check --workspace --target wasm32-unknown-unknown --locked

  wasm:
    uses: Tinkora/.github/.github/workflows/reusable-wasm-quality.yml@ec412670eff1f85882d054253b09b9a78c8025f0 # Tinkora workflow bundle
    with:
      working-directory: crates/cron_maker_web
      toolchain: 1.85.0
      locked: true

  browser:
    name: Playwright (4 viewports)
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read # Download the WASM artifact produced in this run.
      contents: read
    defaults:
      run:
        working-directory: crates/cron_maker_web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: crates/cron_maker_web/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Download the WASM package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wasm-package-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wasm-package

      - name: Install the verified WASM package
        shell: bash
        env:
          WASM_PACKAGE: ${{ runner.temp }}/wasm-package
        run: |
          set -euo pipefail
          [[ -f "$WASM_PACKAGE/cron_maker_web.js" ]]
          [[ -f "$WASM_PACKAGE/cron_maker_web_bg.wasm" ]]
          if find "$WASM_PACKAGE" -type l -print -quit | grep -q .; then
            echo "WASM package contains a symbolic link" >&2
            exit 1
          fi
          mkdir -p static/pkg
          find static/pkg -mindepth 1 -maxdepth 1 -delete
          find "$WASM_PACKAGE" -maxdepth 1 -type f -exec cp -- {} static/pkg/ \;

      - name: Verify the npm lockfile registry
        run: npm run check:lockfile

      - name: Install Node.js dependencies
        run: npm ci --ignore-scripts

      - name: Audit Node.js dependencies
        run: npm audit --audit-level=high

      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Playwright at all configured viewports
        env:
          CI: 'true'
        run: npm run test:browser

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates/cron_maker_web/test-results
          if-no-files-found: ignore
          include-hidden-files: false
          retention-days: 7
