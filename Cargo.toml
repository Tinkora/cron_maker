[workspace]
members = ["crates/cron_maker_core", "crates/cron_maker_web"]
resolver = "3"

[workspace.package]
description = "Privacy-first Unix cron building, explanation, and time-zone-aware previews"
edition = "2024"
homepage = "https://github.com/Tinkora/cron_maker"
license = "MIT"
repository = "https://github.com/Tinkora/cron_maker"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
chrono = "0.4"
jiff = { version = "=0.2.35", default-features = false, features = ["std", "tzdb-bundle-always"] }
jiff-tzdb = "=0.1.8"
croner = "3.0.1"
console_error_panic_hook = "0.1"

[profile.release]
lto = "thin"
strip = true
